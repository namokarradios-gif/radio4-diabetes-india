/* Four-second visual tuner gesture: curved rotation arrows and animated finger. */
#dialGestureHint{
  position:absolute;inset:-9%;z-index:9;pointer-events:none;
  opacity:0;visibility:hidden;
}
#dialGestureHint.is-visible{visibility:visible;animation:gestureHintFade 4s ease forwards}
.gesture-arrows{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gesture-arc{
  fill:none;stroke:#ffffff;stroke-width:4;stroke-linecap:round;
  stroke-dasharray:13 9;filter:drop-shadow(0 0 5px rgba(255,255,255,.85));
  animation:gestureArrowFlow 1.1s linear infinite;
}
.arc-two{animation-direction:reverse}
@keyframes gestureArrowFlow{to{stroke-dashoffset:-44}}
.gesture-finger{
  position:absolute;left:50%;top:50%;right:auto;bottom:auto;
  font-size:clamp(58px,14vw,84px);line-height:1;
  opacity:.72;
  filter:grayscale(1) brightness(0) invert(1) drop-shadow(0 3px 5px #000);
  transform-origin:50% 65%;
  animation:gestureFingerMove .65s ease-in-out infinite alternate;
}
@keyframes gestureFingerMove{
  from{transform:translate(-50%,-50%) translate(-3px,3px) rotate(-9deg) scale(.97)}
  to{transform:translate(-50%,-50%) translate(3px,-4px) rotate(4deg) scale(1.05)}
}
@keyframes gestureHintFade{
  0%{opacity:0}
  12%,86%{opacity:1}
  100%{opacity:0}
}
@media(prefers-reduced-motion:reduce){
  .gesture-arc,.gesture-finger{animation:none}
}

<script>
(function(){

const root = document.getElementById("ondemandSection");
const search = root.querySelector("#search");
const count = root.querySelector("#count");
const recordings = root.querySelector("#recordings");
const talkSuggestions = root.querySelector("#talkSuggestions");
const AUDIO_BASE =
"https://cast4.my-control-panel.com/ondemand/radio4esi/";

let allRecordings = [];
let visibleLimit = 10;
const PAGE_SIZE = 10;
const sortControl = root.querySelector("#recordingSort");
const loadMoreButton = root.querySelector("#loadMoreTalks");
const backToRadioButton = root.querySelector("#backToRadioBottom");

function decodeFilename(filename) {
  const clean = filename.replace(/\.mp3$/i, "");
  const match = clean.match(/^Talk by (.+?) on (.+)$/i);

  if (!match) return null;

  return {
    doctor: match[1].trim(),
    topic: match[2].trim()
  };
}

function render() {
  const query = search.value
    .trim().toLowerCase();

  const filtered = allRecordings.filter(item =>
    item.doctor.toLowerCase().includes(query) ||
    item.topic.toLowerCase().includes(query) ||
    (item.qualification || "").toLowerCase().includes(query) ||
    (item.registration_number || "").toLowerCase().includes(query) ||
    (item.state || "").toLowerCase().includes(query)
  );

  const sortBy = sortControl.value;
  if (sortBy === "doctor") filtered.sort((a,b) => a.doctor.localeCompare(b.doctor, undefined, {sensitivity:"base"}));
  else if (sortBy === "state") filtered.sort((a,b) => (a.state || "").localeCompare(b.state || "", undefined, {sensitivity:"base"}) || a.doctor.localeCompare(b.doctor));
  // Latest Talks keeps the source's newest-first order.

  count.textContent =
    "Showing " + Math.min(visibleLimit, filtered.length) + " of " + filtered.length + " recording" + (filtered.length === 1 ? "" : "s");

  const pageItems = filtered.slice(0, visibleLimit);
  loadMoreButton.hidden = visibleLimit >= filtered.length;
  const container = recordings;
  container.innerHTML = "";

  if (!filtered.length) {
    container.innerHTML =
      '<div class="empty">No matching recordings found.</div>';
    return;
  }

  pageItems.forEach(item => {
    const card = document.createElement("section");
    card.className = "recording";

    const doctor = document.createElement("div");
    doctor.className = "doctor";
    doctor.textContent = item.doctor;

    const topic = document.createElement("div");
    topic.className = "topic";
    topic.textContent = item.topic;

    const details = document.createElement("div");
    details.className = "details";
    details.textContent = [
      item.qualification ? "Qualification: " + item.qualification : "",
      item.state ? "State: " + item.state : "",
      item.registration_number ? "Medical Registration Number: " + item.registration_number : ""
    ].filter(Boolean).join(" | ");

    const audio = document.createElement("audio");
    audio.preload = "none";
    audio.src = item.url;

    const player = document.createElement("div");
    player.className = "audio-player";

    const play = document.createElement("button");
    play.className = "audio-play";
    play.type = "button";
    play.textContent = "▶";
    play.setAttribute("aria-label", "Play " + item.doctor + " recording");

    const track = document.createElement("div");
    track.className = "audio-track";

    const range = document.createElement("input");
    range.className = "audio-range";
    range.type = "range";
    range.min = "0";
    range.max = "1000";
    range.value = "0";
    range.setAttribute("aria-label", "Seek in recording");

    const times = document.createElement("div");
    times.className = "audio-times";
    const current = document.createElement("span");
    const duration = document.createElement("span");
    current.textContent = "0:00";
    duration.textContent = "--:--";
    times.append(current, duration);
    track.append(range, times);
    player.append(play, track);

    const status = document.createElement("div");
    status.className = "audio-status";
    status.textContent = "READY TO PLAY";

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "--:--";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return mins + ":" + secs;
    }
    function updateProgress() {
      const percent = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      range.value = String(Math.round(percent * 10));
      range.style.background = "linear-gradient(90deg,#d8ad5b " + percent + "%,#51452f " + percent + "%)";
      current.textContent = formatTime(audio.currentTime);
      if (Number.isFinite(audio.duration)) duration.textContent = formatTime(audio.duration);
    }
    play.addEventListener("click", async () => {
      if (audio.paused) {
        root.querySelectorAll(".recording audio").forEach(other => {
          if (other !== audio) {
            other.pause();
            other.currentTime = 0;
            const otherCard = other.closest(".recording");
            if (otherCard) {
              const otherButton = otherCard.querySelector(".audio-play");
              const otherStatus = otherCard.querySelector(".audio-status");
              if (otherButton) otherButton.textContent = "▶";
              if (otherStatus) otherStatus.textContent = "READY TO PLAY";
            }
          }
        });
        try {
          await audio.play();
        } catch (error) {
          status.textContent = "UNABLE TO PLAY THIS RECORDING";
        }
      } else {
        audio.pause();
      }
    });
    audio.addEventListener("play", () => {
      play.textContent = "Ⅱ";
      play.setAttribute("aria-label", "Pause " + item.doctor + " recording");
      status.textContent = "NOW PLAYING";
    });
    audio.addEventListener("pause", () => {
      play.textContent = "▶";
      play.setAttribute("aria-label", "Play " + item.doctor + " recording");
      if (!audio.ended) status.textContent = "PAUSED";
    });
    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("loadedmetadata", updateProgress);
    audio.addEventListener("ended", () => {
      play.textContent = "▶";
      play.setAttribute("aria-label", "Play " + item.doctor + " recording");
      status.textContent = "PLAYBACK COMPLETE";
      audio.currentTime = 0;
      updateProgress();
    });
    range.addEventListener("input", () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(range.value) / 1000) * audio.duration;
        updateProgress();
      }
    });

    card.append(doctor, details, topic, player, status, audio);
    container.appendChild(card);
  });
}

async function loadRecordings() {
  try {
    const response = await fetch("recordings.json?t=" + Date.now());
    if (!response.ok) throw new Error("Recording list unavailable");

    const data = await response.json();

    allRecordings = data.recordings
      .map(item => {
        const details = decodeFilename(item.remote_name);
        if (!details) return null;

        return {
          ...details,
          doctor: item.doctor_name || details.doctor,
          qualification: item.qualification || "",
          registration_number: item.registration_number || "",
          state: item.state || "",
          topic: item.topic || details.topic,
          url: AUDIO_BASE + encodeURIComponent(item.remote_name),
          date: item.completed_at || ""
        };
      })
      .filter(Boolean)
      .sort((a,b) => b.date.localeCompare(a.date));

    const suggestions = talkSuggestions;
    const terms = [...new Set(allRecordings.map(item =>
      item.doctor
    ))];

    suggestions.innerHTML = "";
    terms.forEach(term => {
      const option = document.createElement("option");
      option.value = term;
      suggestions.appendChild(option);
    });

    render();
  } catch (error) {
    count.textContent =
      "Unable to load recordings.";
    recordings.innerHTML =
      '<div class="empty">Recordings will appear here when the recording list is connected.</div>';
  }
}

search.addEventListener("input", () => { visibleLimit = PAGE_SIZE; render(); });

});
loadRecordings();

})();
