
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Demand Radio Talks | Radio 4 Diabetes India</title>
<style>
:root{--gold:#d8ad5b;--pale:#f1d99b;--ink:#090a0b;--cream:#f4eee1;--muted:#bdb5a6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#302719 0,#11110f 38%,#08090a 78%);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
header{padding:24px 18px 20px;text-align:center;border-bottom:1px solid #d8ad5b55;background:linear-gradient(180deg,#171511bb,#090a0b66)}
.brand{color:var(--pale);font-size:12px;font-weight:bold;letter-spacing:3px;text-shadow:0 0 8px #d8ad5b44}
h1{font:normal clamp(26px,5vw,34px) Georgia,serif;color:var(--pale);margin:11px 0 7px;text-shadow:0 1px 5px #000}
.subtitle{color:#c9c0b1;font-size:14px}
main{max-width:850px;margin:auto;padding:20px 16px 24px}
.back{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 17px;margin:0 0 20px;border:1px solid #b88e45;border-radius:22px;background:linear-gradient(180deg,#29231a,#11100d);color:var(--pale);text-decoration:none;font-size:13px;font-weight:bold;letter-spacing:.4px;box-shadow:inset 0 1px 3px #ffffff18,0 3px 9px #0008}
.back:hover{background:linear-gradient(180deg,#3a3020,#17130d);border-color:var(--pale)}
.back.bottom{margin:18px 0 0}
.search{width:100%;padding:15px;border-radius:9px;border:1px solid #806333;background:#151411;color:var(--cream);font-size:15px;margin-bottom:20px;box-shadow:inset 0 2px 8px #0008}
.search::placeholder{color:#9c9383}
.search:focus{outline:1px solid var(--gold);border-color:var(--gold)}
.count{color:#c5b99f;font-size:13px;margin-bottom:15px}
.recording{background:linear-gradient(145deg,#242428 0%,#111114 48%,#09090a 100%);border:1px solid #8e6c36;border-radius:13px;padding:19px;margin-bottom:15px;box-shadow:0 8px 22px #0009,inset 0 1px 2px #ffffff18}
.doctor{font:700 20px Georgia,serif;color:var(--pale);margin-bottom:8px;text-shadow:0 0 8px #d8ad5b33}
.topic{font-size:15px;color:#fff2d6;line-height:1.5;margin:13px 0 14px}
.details{font-size:13px;color:#d2c9b9;line-height:1.8;margin-bottom:12px}
.audio-player{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid #806333;border-radius:10px;background:linear-gradient(180deg,#171719,#080809);box-shadow:inset 0 2px 7px #000,0 2px 7px #0008}
.audio-play{flex:0 0 38px;width:38px;height:38px;border-radius:50%;border:1px solid #f0d69a;color:#211707;background:radial-gradient(circle at 35% 25%,#fff1bd,#d8ad5b 52%,#80551e);font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 0 0 2px #08090b,0 0 0 3px #b88e45,inset 0 1px 3px #fff}
.audio-track{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.audio-range{width:100%;height:5px;margin:0;appearance:none;-webkit-appearance:none;border-radius:5px;background:linear-gradient(90deg,var(--gold) 0%,#51452f 0%);cursor:pointer;outline:none}
.audio-range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--pale);border:1px solid #6c4e20;box-shadow:0 0 6px #d8ad5b88}
.audio-range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--pale);border:1px solid #6c4e20;box-shadow:0 0 6px #d8ad5b88}
.audio-times{display:flex;justify-content:space-between;color:#c4b99f;font:11px Arial,sans-serif;font-variant-numeric:tabular-nums}
.audio-status{color:#a99b7d;font-size:10px;letter-spacing:1px;margin-top:8px;min-height:12px}
.empty{color:#c5b99f;text-align:center;padding:35px 10px}
footer{text-align:center;color:#9a907f;font-size:12px;padding:22px 16px 30px;border-top:1px solid #ffffff12}
@media(max-width:480px){header{padding:20px 14px 17px}main{padding:17px 12px 22px}.recording{padding:15px}.doctor{font-size:19px}.audio-player{gap:9px;padding:9px}.audio-play{flex-basis:36px;width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="brand">RADIO 4 DIABETES INDIA</div>
  <h1>On-Demand Radio Talks of Doctors</h1>
</header>

<main>
  <a class="back" href="index.html">← Back to Radio</a>
  <input id="search" class="search" type="search"
    list="talkSuggestions" autocomplete="off"
    placeholder="Search doctor name or talk topic...">
  <datalist id="talkSuggestions"></datalist>
  <div id="count" class="count">Loading recordings...</div>
  <div id="recordings"></div>
  <a class="back bottom" href="index.html">← Back to Radio</a>
</main>

<footer>Radio 4 Diabetes India · Patient Education & Public Health Awareness</footer>

<script>
const AUDIO_BASE =
"https://cast4.my-control-panel.com/ondemand/radio4esi/";

let allRecordings = [];

function decodeFilename(filename) {
  const clean = filename.replace(/\.mp3$/i, "");
  const match = clean.match(/^Talk by (.+?) on (.+)$/i);

  if (!match) return null;

  return {
    doctor: match[1].trim(),
    topic: match[2].trim().replace(/\s+\d{8}\s+\d{6}$/, "")
  };
}

function render() {
  const query = document.getElementById("search").value
    .trim().toLowerCase();

  const filtered = allRecordings.filter(item =>
    item.doctor.toLowerCase().includes(query) ||
    item.topic.toLowerCase().includes(query) ||
    (item.qualification || "").toLowerCase().includes(query) ||
    (item.registration_number || "").toLowerCase().includes(query) ||
    (item.state || "").toLowerCase().includes(query)
  );

  document.getElementById("count").textContent =
    filtered.length + " recording" + (filtered.length === 1 ? "" : "s");

  const container = document.getElementById("recordings");
  container.innerHTML = "";

  if (!filtered.length) {
    container.innerHTML =
      '<div class="empty">No matching recordings found.</div>';
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement("section");
    card.className = "recording";

    const doctor = document.createElement("div");
    doctor.className = "doctor";
    doctor.textContent = item.doctor;

    const topic = document.createElement("div");
    topic.className = "topic";
    topic.textContent = item.topic;

    const audio = document.createElement("audio");
    audio.preload = "none";
    audio.src = item.url;

    const player = document.createElement("div");
    player.className = "audio-player";

    const play = document.createElement("button");
    play.className = "audio-play";
    play.type = "button";
    play.textContent = "▶";
    play.setAttribute("aria-label", "Play " + item.doctor + " recording");

    const track = document.createElement("div");
    track.className = "audio-track";

    const range = document.createElement("input");
    range.className = "audio-range";
    range.type = "range";
    range.min = "0";
    range.max = "1000";
    range.value = "0";
    range.setAttribute("aria-label", "Seek in recording");

    const times = document.createElement("div");
    times.className = "audio-times";
    const current = document.createElement("span");
    const duration = document.createElement("span");
    current.textContent = "0:00";
    duration.textContent = "--:--";
    times.append(current, duration);
    track.append(range, times);
    player.append(play, track);

    const status = document.createElement("div");
    status.className = "audio-status";
    status.textContent = "READY TO PLAY";

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "--:--";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return mins + ":" + secs;
    }
    function updateProgress() {
      const percent = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      range.value = String(Math.round(percent * 10));
      range.style.background = "linear-gradient(90deg,#d8ad5b " + percent + "%,#51452f " + percent + "%)";
      current.textContent = formatTime(audio.currentTime);
      if (Number.isFinite(audio.duration)) duration.textContent = formatTime(audio.duration);
    }
    play.addEventListener("click", async () => {
      if (audio.paused) {
        document.querySelectorAll(".audio-player audio").forEach(other => {
          if (other !== audio) {
            other.pause();
            other.currentTime = 0;
            const otherCard = other.closest(".recording");
            if (otherCard) {
              const otherButton = otherCard.querySelector(".audio-play");
              const otherStatus = otherCard.querySelector(".audio-status");
              if (otherButton) otherButton.textContent = "▶";
              if (otherStatus) otherStatus.textContent = "READY TO PLAY";
            }
          }
        });
        try {
          await audio.play();
        } catch (error) {
          status.textContent = "UNABLE TO PLAY THIS RECORDING";
        }
      } else {
        audio.pause();
      }
    });
    audio.addEventListener("play", () => {
      play.textContent = "Ⅱ";
      play.setAttribute("aria-label", "Pause " + item.doctor + " recording");
      status.textContent = "NOW PLAYING";
    });
    audio.addEventListener("pause", () => {
      play.textContent = "▶";
      play.setAttribute("aria-label", "Play " + item.doctor + " recording");
      if (!audio.ended) status.textContent = "PAUSED";
    });
    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("loadedmetadata", updateProgress);
    audio.addEventListener("ended", () => {
      play.textContent = "▶";
      play.setAttribute("aria-label", "Play " + item.doctor + " recording");
      status.textContent = "PLAYBACK COMPLETE";
      audio.currentTime = 0;
      updateProgress();
    });
    range.addEventListener("input", () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(range.value) / 1000) * audio.duration;
        updateProgress();
      }
    });

    card.append(doctor, topic, player, status, audio);
    container.appendChild(card);
  });
}

async function loadRecordings() {
  try {
    const response = await fetch("recordings.json?t=" + Date.now());
    if (!response.ok) throw new Error("Recording list unavailable");

    const data = await response.json();

    allRecordings = data.recordings
      .map(item => {
        const details = decodeFilename(item.remote_name);
        if (!details) return null;

        return {
          ...details,
          doctor: item.doctor_name || details.doctor,
          qualification: item.qualification || "",
          registration_number: item.registration_number || "",
          state: item.state || "",
          topic: item.topic || details.topic,
          url: AUDIO_BASE + encodeURIComponent(item.remote_name),
          date: item.completed_at || ""
        };
      })
      .filter(Boolean)
      .sort((a,b) => b.date.localeCompare(a.date));

    const suggestions = document.getElementById("talkSuggestions");
    const terms = [...new Set(allRecordings.map(item =>
      item.doctor
    ))];

    suggestions.innerHTML = "";
    terms.forEach(term => {
      const option = document.createElement("option");
      option.value = term;
      suggestions.appendChild(option);
    });

    render();
  } catch (error) {
    document.getElementById("count").textContent =
      "Unable to load recordings.";
    document.getElementById("recordings").innerHTML =
      '<div class="empty">Recordings will appear here when the recording list is connected.</div>';
  }
}

document.getElementById("search").addEventListener("input", render);
loadRecordings();
</script>
</body>
</html>
